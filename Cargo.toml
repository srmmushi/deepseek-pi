[package]
name = "dsp"
version = "0.2.0"
edition = "2021"
description = "DSP (deepseek-pi) —— Rust + Ratatui 终端编程助手，仅使用 DeepSeek 网页版"
license = "MIT"

[[bin]]
name = "dsp"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"
# HTTP。用 blocking + 后台线程 + mpsc，不引入 tokio。
# TLS 用 rustls：纯 Rust，不依赖系统的 openssl 开发包，Debian/Ubuntu 系的
# WSL 里开箱即用（native-tls 那套要另外装 libssl-dev）。
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 加密（与历史 TypeScript 实现逐字节一致，才能复用已有凭证）
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rand = "0.8"
base64 = "0.22"
# PoW：执行 DeepSeek 官方 sha3 wasm
wasmi = { version = "0.36", default-features = false, features = ["std"] }
# 微信扫码登录：把二维码画到终端里（只用它的 unicode 渲染，不拉 image/svg）
qrcode = { version = "0.14", default-features = false }
# 微信那边给的是图片，得先解码；解出内容再用 qrcode 重画，比缩放像素稳
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.9"
# 环境信息（指纹派生）
hostname = "0.4"
whoami = "1"
anyhow = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
