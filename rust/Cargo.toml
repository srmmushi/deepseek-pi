[package]
name = "dsp"
version = "0.1.0"
edition = "2021"
description = "DSP (deepseek-pi) —— Rust + Ratatui 终端编程助手，仅使用 DeepSeek 网页版"
license = "MIT"

[[bin]]
name = "dsp"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"
# HTTP（blocking + 后台线程 + mpsc，刻意不引入 tokio）
#
# 用 native-tls 而不是 rustls-tls：rustls 依赖 ring，ring 的构建脚本要调用
# MinGW 的 ar/cc，而它在含中文的路径下会乱码失败（ar: ...No such file or directory）。
# native-tls 在 Windows 上走系统 schannel，纯 FFI，不需要编译任何 C 代码。
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 加密（与 TS 版逐字节一致，才能复用已有凭证）
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rand = "0.8"
base64 = "0.22"
# PoW：执行 DeepSeek 官方 sha3 wasm
wasmi = { version = "0.36", default-features = false, features = ["std"] }
# 环境信息（指纹派生）
hostname = "0.4"
whoami = "1"
anyhow = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
